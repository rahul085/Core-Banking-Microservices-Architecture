server:
  port: 7006

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:    # <--- ADD THESE TWO LEVELS
          routes:
            # 1. Route for Auth Service (Public)
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth/**

            # 2. Route for Transaction Service (Protected)
            - id: transaction-service
              uri: lb://transaction-service
              predicates:
                - Path=/api/v1/transactions/**
              filters:
                - AuthenticationFilter

            # 3. Route for Account Service (Protected)
            - id: account-service
              uri: lb://account-service
              predicates:
                - Path=/api/v1/accounts/**
              filters:
                - AuthenticationFilter

eureka:
  client:
    service-url:
      defaultZone: http://localhost:7001/eureka/



jwt:
  secret: ${secret}
